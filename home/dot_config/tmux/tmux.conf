# tmux.conf — Claude Code agent teams + general use

# Use 256 colors and true color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse support (click panes, resize, scroll)
set -g mouse on

# Start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set -g history-limit 50000

# Reduce escape time (faster key response)
set -g escape-time 10

# Enable focus events (needed for some terminal apps)
set -g focus-events on

# Allow iTerm2 escape sequences to pass through (badge, notifications, etc.)
set -g allow-passthrough on

# NOTE: `extended-keys on` + `terminal-features extkeys` were previously
# enabled here to try to pass Shift+Enter through to Claude Code. In
# practice that never worked (known Claude Code bug #26629/#6072 — Claude
# does not request kitty keyboard activation in a way tmux honors), and
# keeping them on contributed to a separate bug where control bytes
# (0x01/0x05/0x15) were mangled in `tmux -CC` + Claude sessions.
# Use Ctrl+J or backslash+Enter for newlines instead.

# Status bar — keep minimal since Claude Code has its own status line
set -g status-position bottom
set -g status-style "bg=#2E3440,fg=#D8DEE9"
set -g status-left "#[fg=#88C0D0,bold] #S "
set -g status-right "#[fg=#A3BE8C] %H:%M "
set -g status-left-length 30

# Pane borders — subtle Nord-inspired colors
set -g pane-border-style "fg=#4C566A"
set -g pane-active-border-style "fg=#88C0D0"

# Window status styling
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#2E3440,bg=#88C0D0,bold] #I:#W "

# Prefix key: Ctrl+\ — does not collide with readline-style line editing
# bindings in Claude Code's TUI (which uses ^A/^B/^E/^F/^H/^K/^N/^P/^U/^W/^Y).
# Previously C-a, which swallowed Cmd+Left (iTerm2 sends 0x01 for Cmd+Left).
unbind C-b
set -g prefix 'C-\'
bind 'C-\' send-prefix

# Split panes with intuitive keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes with Alt+arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes with Ctrl+Alt+arrow
bind -n C-M-Left resize-pane -L 5
bind -n C-M-Right resize-pane -R 5
bind -n C-M-Up resize-pane -U 3
bind -n C-M-Down resize-pane -D 3

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"
